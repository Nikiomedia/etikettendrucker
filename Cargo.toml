[package]
name = "etikettendrucker"
version = "0.1.0"
edition = "2021"
description = "PC-App für Bluetooth-Etikettendrucker Pristar/Marklife P15"
license = "MIT"
repository = "https://github.com/Nikiomedia/etikettendrucker"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures = "0.3"
uuid = "1"
ab_glyph = "0.2"
fontdb = "0.23"
qrcode = { version = "0.14", default-features = false }
barcoders = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
